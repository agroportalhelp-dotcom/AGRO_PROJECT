{% extends 'core/base.html' %}
{% block title %}Reset Password | AGRO Portal{% endblock %}

{% block extra_css %}
<style>
    .auth-card {
        border: none;
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
        overflow: hidden;
    }
    .auth-header-accent {
        background: linear-gradient(135deg, #114b29 0%, #1c6d3c 100%);
        padding: 40px 20px;
        color: #ffffff;
        text-align: center;
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-lg-5 col-md-7 col-sm-10">
        <div class="card auth-card">
            <div class="auth-header-accent">
                <div class="mb-2">
                    <span class="p-3 bg-white bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                        <i class="fa-solid fa-key fs-3 text-warning"></i>
                    </span>
                </div>
                <h3 class="fw-bold mb-1">Forgot Password</h3>
                <p class="mb-0 text-white-50 small">Provide your registered mobile number below to request an OTP</p>
            </div>

            <div class="card-body p-4 p-md-5">
                <form method="POST">
    {% csrf_token %}
    <div class="mb-3">
        <label for="email" class="form-label fw-bold small text-secondary">Registered Gmail Address</label>
        <input type="email" name="email" id="email" class="form-control" placeholder="name@gmail.com" required>
    </div>
    <button type="submit" class="btn btn-success w-100 py-3 fw-bold rounded-3">
        Send Reset OTP to Gmail <i class="fa-solid fa-envelope ms-2"></i>
    </button>
</form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
