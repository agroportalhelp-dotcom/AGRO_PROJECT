{% extends 'core/base.html' %}
{% block title %}Add Helpful Website | AGRO Portal{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 border-0 shadow-sm rounded-4 bg-white">
            <h3 class="fw-bold text-success mb-3"><i class="fa-solid fa-plus-circle me-2"></i>Add Helpful Website</h3>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100 fw-bold py-2 mt-3">Publish Website Link</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'helpful_sites' %}" class="text-decoration-none text-muted small">← Back to Helpful Sites</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
